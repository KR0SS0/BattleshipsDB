# CI: build and test every push and pull request.
# CD: when main is green, publish the Blazor game to https://kr0ss0.github.io/BattleshipsDB/
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch cancels the older one
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Builds every project, then runs the unit tests and the integration tests.
      # The integration tests start Postgres with Testcontainers, using the runner's Docker.
      - name: Build and run tests
        run: dotnet test -c Release

  build-web:
    name: Build web game
    needs: test # Only runs when the tests passed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SITE_DIR: publish/wwwroot
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish the web app
        run: dotnet publish src/Battleship.Web/Battleship.Web.csproj -c Release -o publish

      - name: Set the base path
        run: sed -i "s|<base href=\"/\" />|<base href=\"/${{ github.event.repository.name }}/\" />|" "$SITE_DIR/index.html"

      - name: Disable Jekyll
        run: touch "$SITE_DIR/.nojekyll"

      - name: Add 404 fallback
        run: cp "$SITE_DIR/index.html" "$SITE_DIR/404.html"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

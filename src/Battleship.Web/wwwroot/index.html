<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
    <meta name="description" content="Battleship in the browser: place your fleet and sink the enemy. Built with C#, .NET and Blazor." />
    <meta name="theme-color" content="#0a1a2f" />
    <link rel="preload" href="fonts/BlackOpsOne-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="Battleship.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <h1 class="loading-title">Battleship</h1>
            <div class="loading-bar"><div class="loading-bar-fill"></div></div>
            <p class="loading-text">Preparing the fleet…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
